<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Upload History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: {
            gradient: "gradientBG 15s ease infinite"
          },
          keyframes: {
            gradientBG: {
              "0%": { backgroundPosition: "0% 50%" },
              "50%": { backgroundPosition: "100% 50%" },
              "100%": { backgroundPosition: "0% 50%" }
            }
          },
          backgroundImage: {
            'animated-gradient': "linear-gradient(270deg, #00dbde, #fc00ff, #ff7300, #00dbde)"
          }
        }
      }
    };

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="bg-animated-gradient bg-[length:400%_400%] animate-gradient min-h-screen text-gray-800 dark:text-white">

  <!-- Header -->
  <header class="bg-white/70 dark:bg-gray-900/70 backdrop-blur-md p-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-white flex items-center gap-2">
      📜 Upload History
    </h1>
    <div class="flex gap-4 items-center">
      <a href="/" class="text-sm text-blue-600 dark:text-blue-300 underline">← Back to Upload</a>
      <button onclick="toggleDarkMode()" class="bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded hover:bg-gray-300 dark:hover:bg-gray-600 text-sm">
        🌓 Toggle Theme
      </button>
    </div>
  </header>

  <!-- Content -->
  <div class="max-w-6xl mx-auto px-4 mt-10">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for row in history %}
      <div class="bg-white/70 dark:bg-gray-800/80 backdrop-blur-md p-5 rounded-2xl shadow-xl hover:scale-[1.02] transition-all">
        <p class="text-xs text-gray-600 dark:text-gray-300 mb-2 font-semibold">
          Uploaded at: {{ row[2] if row[2] else "N/A" }}
        </p>
        <img src="{{ url_for('static', filename='output/' + row[1]) }}"
     class="rounded-xl border shadow-md max-w-full" />

      </div>
      {% endfor %}
    </div>
  </div>

  <footer class="text-center text-xs text-white/90 mt-12 mb-6">
    &copy; {{ year }} Crack Detection Web App
  </footer>

</body>
</html>
